name: Post to Threads

on:
  schedule:
    - cron: "40 0 * * *"   # 07:40 по Сайгону → первый пост в 08:00
    - cron: "40 5 * * *"   # 12:40 по Сайгону → первый пост в 13:00
    - cron: "40 11 * * *"  # 18:40 по Сайгону → первый пост в 19:00
  workflow_dispatch:
    inputs:
      slot:
        description: "morning, midday или evening"
        required: true
        default: morning
      dry_run:
        description: "Только проверка, без публикации"
        type: boolean
        default: true

concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "40 0 * * *") SLOT=morning ;;
              "40 5 * * *") SLOT=midday ;;
              *) SLOT=evening ;;
            esac
            python post.py "$SLOT"
          else
            FLAGS="--no-wait"
            [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="--dry-run"
            python post.py "${{ inputs.slot }}" $FLAGS
          fi
      - name: Save log
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add logs || true
          git diff --cached --quiet || (git commit -m "log $(date -u +%F_%H%M)" && git push)
